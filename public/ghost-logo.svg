<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ghostGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b3e0d2"/>
      <stop offset="45%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b3e0d2"/>
      <stop offset="100%" stop-color="#52b788"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Glow Stealth Aura -->
  <circle cx="50" cy="50" r="44" fill="#52b788" opacity="0.18" filter="url(#glow)"/>
  
  <!-- Outer Shield Ring -->
  <circle cx="50" cy="50" r="46" stroke="#92c9b1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
  
  <!-- Ghost Silhouette Body -->
  <path d="M50 15 C33 15 22 27 22 48 C22 66 19 79 27 81 C33 82 38 74 44 79 C48 83 52 83 56 79 C62 74 67 82 73 81 C81 79 78 66 78 48 C78 27 67 15 50 15 Z" 
        fill="url(#ghostGrad)" 
        stroke="#b3e0d2"
        stroke-width="1.2" />
        
  <!-- Cyber Optic Eyes -->
  <ellipse cx="40" cy="45" rx="5.5" ry="7" fill="#06241a"/>
  <ellipse cx="60" cy="45" rx="5.5" ry="7" fill="#06241a"/>
  <circle cx="42" cy="43.5" r="2.4" fill="url(#eyeGrad)"/>
  <circle cx="62" cy="43.5" r="2.4" fill="url(#eyeGrad)"/>
  <circle cx="43" cy="42.5" r="0.8" fill="#ffffff"/>
  <circle cx="63" cy="42.5" r="0.8" fill="#ffffff"/>
  
  <!-- Stealth Wave Mouth -->
  <path d="M44 58 Q50 63 56 58" stroke="#06241a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
